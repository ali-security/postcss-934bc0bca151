name: Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    name: Node.js Latest Full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run tests
        # `pnpm test` = `pnpm run /^test:/`, which includes test:integration
        # (test/integration.js downloads live third-party CSS via
        # postcss-parser-tests' testOnReal). Today's github.githubassets.com
        # stylesheets fail round-trip — input drift, not a postcss defect.
        # Excluded here, in the workflow, NOT in package.json (package.json
        # ships in the published tarball; editing it breaks byte-parity).
        run: pnpm run test:types && pnpm run test:version && pnpm run test:size && pnpm run test:coverage
      - name: Pack the release tarball
        run: |
          ./node_modules/.bin/clean-publish --without-publish --temp-dir "${{ runner.temp }}/publish"
          mkdir -p "$GITHUB_WORKSPACE/pack-output"
          cd "${{ runner.temp }}/publish"
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/pack-output"
      - name: Upload the release tarball
        uses: actions/upload-artifact@v4
        with:
          name: postcss-tarball
          path: pack-output/postcss-8.4.31.tgz
          if-no-files-found: error
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version:
          - 18
          - 16
    name: Node.js ${{ matrix.node-version }} Quick
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run unit tests
        run: pnpm run unit
  old:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version:
          - 14
          - 12
          - 10
    name: Node.js ${{ matrix.node-version }} Quick
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v1
        with:
          version: 3
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Pin the registry to the release date
        # This job cannot use --frozen-lockfile (pnpm 3 predates
        # lockfileVersion '6.0'), so `^`-ranged devDeps resolve to today's
        # releases instead of the locked ones: postcss-parser-tests 8.9.0
        # needs `node:fs` (absent on Node 10/12) and its fixtures drifted from
        # what 8.4.31 expects. The pin restores the locked 8.8.0.
        run: npm config set registry https://:2023-09-28T22%3A15%3A08.722Z@time-machines-npm.sealsecurity.io/
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Downgrade TypeScript
        run: pnpm install typescript@4
      - name: Run unit tests
        run: pnpm run old
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    name: Windows Quick
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          # pinned: `latest` now resolves to pnpm 10, which rejects lockfileVersion '6.0'
          version: 8
      - name: Install Node.js LTS
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run unit tests
        run: pnpm run unit
